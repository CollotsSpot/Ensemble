name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
#
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'master'
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (Drift database)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --debug

      # Upload whatever APKs were produced (universal + any ABI splits)
      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK summary
        run: |
          echo "## APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APKs:" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          ls -lh build/app/outputs/apk/**/*.apk 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
